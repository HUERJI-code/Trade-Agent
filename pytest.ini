# 文件作用：pytest 的项目配置。
# 声明下面设置属于 pytest 配置节。
[pytest]
# 默认只从 tests 目录发现测试，因此 scripts/test_import_tools.py 不包含在这个默认集合中。
testpaths = tests
# 开始登记自定义测试标记，避免出现未知标记警告。
markers =
# integration 表示测试会访问本机教学数据库；这个标记本身不会自动跳过测试，可用 -m "not integration" 排除它们。
    integration: accesses the local teaching database using the readonly account
